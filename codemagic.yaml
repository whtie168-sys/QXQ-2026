workflows:

  ios-native-quick-start:

    name: QXQ26

    max_build_duration: 120

    instance_type: mac_mini_m2


    integrations:

      app_store_connect: PlantPulse


    environment:

      ios_signing:

        distribution_type: app_store

        bundle_identifier: com.KilnTracebiaomianzudi.cn


      vars:

        BUNDLE_ID: com.KilnTracebiaomianzudi.cn

        PROJECT_PATH: "QXQ"

        XCODE_WORKSPACE: "QXQ/ios-chat.xcworkspace"

        XCODE_SCHEME: "ios-chat"

        APP_STORE_APPLE_ID: 6809367150


      xcode: latest



    scripts:


      - name: Set up provisioning profiles settings on Xcode project

        script: |

          xcode-project use-profiles




      - name: Build ipa for distribution

        script: |

          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty



    artifacts:

      - build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM



    publishing:


      email:

        recipients:

          - 985446278@qq.com

          - user_2@example.com


        notify:

          success: true

          failure: false



      app_store_connect:

        auth: integration

        submit_to_testflight: true

        submit_to_app_store: false
