workflows:
  ios-native-quick-start:
    name: QXQ-2026
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: QXQ2026

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.VesicaDeskdanbaifenbu.cn
      vars:
        # 目录名是 QXQ，不是仓库根目录 QXQ-2026
        PROJECT_PATH: "QXQ"
        # 必须用 workspace：主工程通过 BUILT_PRODUCTS_DIR 引用
        # WFChatUIKit.framework / WFChatClient.framework，单独编 .xcodeproj 会链接失败
        XCODE_WORKSPACE: "QXQ/ios-chat.xcworkspace"
        XCODE_SCHEME: "WildFireChat"
        APP_STORE_APPLE_ID: 6809367150
      xcode: latest
      # 本工程无 Podfile，不要启用 cocoapods

    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: |
          # 不指定 --project，让它扫描 workspace 下全部工程
          xcode-project use-profiles

      # 版本号直接用工程里设置的值（当前 MARKETING_VERSION=2.0 / CURRENT_PROJECT_VERSION=4），
      # 不做自动递增：工程未设置 VERSIONING_SYSTEM，agvtool 不可用；
      # 自动递增会按 ASC 上的最新构建号计算，覆盖掉手工设定的值

      - name: Build ipa for distribution
        script: |
          # --disable-xcpretty：xcpretty 会吞掉签名阶段的真实报错，
          # 排查完可以去掉
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - 985446278@qq.com
        notify:
          success: true
          failure: false
      app_store_connect:
        auth: integration
        submit_to_app_store: true
